# Load the shared local credentials from the repository or module working directory.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.application.name=finance-service

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
server.port=8081
# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/finance_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

user.service.url=http://localhost:8080
jwt.secret=${JWT_SECRET}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized

topic.name=transaction-events

outbox.poll-interval-ms=1000
outbox.batch-size=20
outbox.send-timeout-ms=10000
outbox.retry-delay-ms=5000
outbox.retention-days=7
outbox.cleanup-batch-size=1000
outbox.cleanup-interval-ms=3600000

management.metrics.tags.application=${spring.application.name}
finance.kafka.retry-delay-ms=1000
