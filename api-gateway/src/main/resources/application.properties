# Load the shared local credentials from the repository or module working directory.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.application.name=api-gateway
server.port=9000

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized

jwt.secret=${JWT_SECRET}


#OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/docs/user-service/api-docs
springdoc.swagger-ui.urls[1].name=Finance Service
springdoc.swagger-ui.urls[1].url=/docs/finance-service/api-docs
springdoc.swagger-ui.urls[2].name=Analytical Service
springdoc.swagger-ui.urls[2].url=/docs/analytical-service/api-docs

management.metrics.tags.application=${spring.application.name}


services.user.url=http://localhost:8080
services.finance.url=http://localhost:8081
services.analytics.url=http://localhost:8082
